name: drone_kulagi
description: Detects drone propeller sound with the phone microphone.
publish_to: none
version: 2.1.0+3

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.3.2
  tflite_flutter: ^0.12.1
  drone_audio:
    path: packages/drone_audio

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  # Eklentiler CocoaPods ile; Swift Package Manager kapalı (Xcode paket çözümleme hatası)
  config:
    enable-swift-package-manager: false
  assets:
    - assets/models/yamnet_embed.tflite
    - assets/models/YAMNET_LICENSE.txt
    - assets/sounds/drone_sos.wav
    - assets/fonts/OFL-Poppins.txt
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800

name: drone_audio
description: Drone Kulağı için arka planda mikrofon yakalama, bildirim ve titreşim (Android + iOS).
version: 1.0.0
publish_to: none

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.osmanemreaydin.drone_audio
        pluginClass: DroneAudioPlugin
      ios:
        pluginClass: DroneAudioPlugin
